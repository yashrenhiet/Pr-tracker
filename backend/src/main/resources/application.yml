spring:
  application:
    name: prtracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prtracker}
    username: ${DB_USERNAME:prtracker}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# AI-assisted code review. Disabled and dry-run by default: nothing calls out to a model or
# GitHub, and even once enabled, nothing is posted to GitHub, until you deliberately configure it.
ai:
  review:
    enabled: ${AI_REVIEW_ENABLED:false}
    provider: ${AI_REVIEW_PROVIDER:openai} # openai | anthropic
    api-key: ${AI_REVIEW_API_KEY:}
    model: ${AI_REVIEW_MODEL:} # blank = provider's current default (see AiReviewProperties)
    base-url: ${AI_REVIEW_BASE_URL:} # blank = the provider's public API; set to point at a proxy or self-hosted gateway
    github-token: ${AI_REVIEW_GITHUB_TOKEN:} # needs read access to PRs, and write access to post reviews
    dry-run: ${AI_REVIEW_DRY_RUN:true}
    timeout-seconds: ${AI_REVIEW_TIMEOUT_SECONDS:120}
    max-diff-chars: ${AI_REVIEW_MAX_DIFF_CHARS:60000}
    scheduler-enabled: ${AI_REVIEW_SCHEDULER_ENABLED:false}
    scheduler-cron: "${AI_REVIEW_SCHEDULER_CRON:0 */10 * * * *}"
    scheduler-batch-size: ${AI_REVIEW_SCHEDULER_BATCH_SIZE:5}
