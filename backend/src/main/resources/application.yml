spring:
  application:
    name: prtracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prtracker}
    username: ${DB_USERNAME:prtracker}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
